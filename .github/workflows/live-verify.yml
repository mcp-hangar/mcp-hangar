# Live (black-box) feature verification. The whole suite runs on demand and
# nightly. Tier 0 (a real process and a stub backend, no compose, no IdP) also
# runs on pull requests that touch the front door, the server or the domain
# services: 48 tests in about 2.5 minutes, inside the 5-minute target. Tiers
# whose prerequisites are absent skip cleanly; T1 (compose), T2 (Keycloak) and
# T4 (PostgreSQL) stay nightly.
#
# The PR trigger is path-filtered, so `live-pr` reports only when those paths
# change. A check that is sometimes absent cannot be a required status as it is;
# making it required is a branch-protection decision for the maintainer.
name: live-verify

on:
  pull_request:
    paths:
      - "src/mcp_hangar/fastmcp_server/**"
      - "src/mcp_hangar/server/**"
      - "src/mcp_hangar/domain/services/**"
      - "tests/live/**"
      - ".github/workflows/live-verify.yml"
  workflow_dispatch:
    inputs:
      marker:
        description: "pytest marker expression to select tiers"
        default: "live"
        required: false
  schedule:
    - cron: "0 3 * * *" # nightly 03:00 UTC

concurrency:
  group: live-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-pr:
    name: Live tier 0 on pull requests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run live tier 0
        env:
          MCP_HANGAR_LIVE_VERIFY: "1"
        run: uv run pytest tests/live -m "live and t0" --timeout=180 -ra

  live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 30 for the live tiers, and about 15 for the parity property's nightly budget.
    timeout-minutes: 45
    # T4 runs two gateways over one PostgreSQL; each module creates and drops
    # a database of its own on this server.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hangar
          POSTGRES_PASSWORD: hangar
          POSTGRES_DB: hangar
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U hangar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run live verification
        env:
          MCP_HANGAR_LIVE_VERIFY: "1"
          HANGAR_TEST_POSTGRES_DSN: "host=127.0.0.1 port=55432 user=hangar password=hangar dbname=hangar"
        run: uv run pytest tests/live -m "${{ github.event.inputs.marker || 'live' }}" --timeout=180 -ra

      # The listing/call parity property (#1785) runs on every PR with a small
      # example budget (ci-core); here it gets the large one. Not a live tier:
      # it boots the app in-process, so it needs no running gateway.
      - name: Run the listing/call parity property at the nightly budget
        if: ${{ !cancelled() }}
        env:
          HANGAR_PARITY_EXAMPLES: "300"
        run: uv run pytest tests/integration/test_what_a_caller_is_shown_is_what_it_may_call.py --timeout=1800 -ra
