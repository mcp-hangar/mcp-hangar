# Official MCP conformance suite, run against a real `serve --http` gateway.
#
# Gate E of the release matrix (#550). Our own live tiers assert what we
# believe the protocol requires; this asserts what the specification's
# maintainers say it requires, which is the part we cannot mark our own
# homework on.
#
# Scope, stated plainly: the `latest` suite (0.1.16) has NO 2026-07-28 server
# vectors, so the first job certifies the generation we still serve for
# back-compat. The second job runs the `0.2.0-alpha` line, which has them
# (`--requirements 2026-07-28`), against its own baseline, and the same alpha
# again on `--requirements 2025-11-25`. The
# upstream repo already carries `server-stateless` (SEP-2575 discover) and
# `tasks-lifecycle` scenarios that are not in the npm build; when they ship,
# they cover exactly what we built and belong here. `check-for-new-scenarios`
# below exists to notice that rather than rely on someone remembering.
name: MCP Conformance

# No `paths:` filter on the trigger, deliberately, for the reason ci-core.yml
# gives: a path-filtered workflow produces no check run on a PR it skips, and a
# required check that never reports stays pending forever. The `changes` job
# below decides whether the suite runs, and the `Conformance` job always
# reports, so that one name can be a required check on `main` (#1902):
#   scripts/setup-branch-protection.sh --add "Conformance"
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 2" # weekly; also how the scenario-drift check runs
  workflow_dispatch: {}

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The alpha line every revision-selected leg runs, spelled once: the legs run
# it and the pass table names it, so the two cannot disagree.
env:
  SUITE: 0.2.0-alpha.12

jobs:
  # Whether the suite has anything to judge. Everything Hangar serves or sends
  # on a connection can change a result, so the filter is the whole package and
  # the backend the server legs proxy, not only the transport modules. A
  # schedule or a manual run always runs the suite.
  changes:
    name: Conformance paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files through the API
    outputs:
      run: ${{ steps.always.outputs.run || steps.filter.outputs.conformance }}
    steps:
      - name: Scheduled or manual runs always run the suite
        id: always
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: echo "run=true" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.always.outputs.run != 'true'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: steps.always.outputs.run != 'true'
        with:
          filters: |
            conformance:
              - 'src/mcp_hangar/**'
              - 'examples/provider_math/**'
              - 'scripts/conformance_pass_table.py'
              - 'tests/conformance/**'
              - '.github/workflows/conformance.yml'
              - 'pyproject.toml'

  conformance:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Server conformance (baselined)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install the gateway
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start `serve --http` with a subprocess backend
        run: |
          cat > conformance-config.yaml <<'EOF'
          logging:
            level: WARNING
          mcp_servers:
            math:
              mode: subprocess
              command: ["python", "examples/provider_math/server.py"]
              idle_ttl_s: 300
          EOF
          mcp-hangar --config conformance-config.yaml serve --http \
            --host 127.0.0.1 --port 52444 > gateway.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:52444/health/live; then
              echo "gateway healthy"; exit 0
            fi
            sleep 1
          done
          echo "::error::gateway never became healthy"; tail -50 gateway.log; exit 1

      # Pinned, not @latest: a suite that changes under us turns a red build
      # into a guessing game about whose change caused it. `check-for-new-
      # scenarios` is what watches for movement.
      - name: Run the conformance suite
        run: |
          npx -y @modelcontextprotocol/conformance@0.1.16 server \
            --url http://127.0.0.1:52444/mcp \
            --suite core \
            --expected-failures tests/conformance/baseline.yml

      - name: Gateway log on failure
        if: failure()
        run: tail -100 gateway.log

  # The same suite, on the revision Hangar is built for. The published `latest`
  # (0.1.16) has no 2026-07-28 vectors; the `0.2.0-alpha` line does, selected by
  # `--requirements 2026-07-28`. Pinned to an exact alpha for the reason the
  # core run is pinned, and baselined in its own file so the two generations'
  # known failures do not blur. The pass table is generated from the run's
  # results and written to the job summary; nothing in it is hand-written.
  #
  # The 2025-11-25 leg (#1902) runs the same alpha against the revision Hangar
  # still serves for back-compat, so both revisions are judged by one suite
  # version, the one the client job uses too. It does not replace the 0.1.16
  # job above, which stays until `latest` moves past it.
  conformance-server:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Server conformance ${{ matrix.revision }} (baselined)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: ["2026-07-28", "2025-11-25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install the gateway
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start `serve --http` with a subprocess backend
        run: |
          cat > conformance-config.yaml <<'EOF'
          logging:
            level: WARNING
          mcp_servers:
            math:
              mode: subprocess
              command: ["python", "examples/provider_math/server.py"]
              idle_ttl_s: 300
          EOF
          mcp-hangar --config conformance-config.yaml serve --http \
            --host 127.0.0.1 --port 52444 > gateway.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:52444/health/live; then
              echo "gateway healthy"; exit 0
            fi
            sleep 1
          done
          echo "::error::gateway never became healthy"; tail -50 gateway.log; exit 1

      - name: Run the conformance suite for ${{ matrix.revision }}
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          npx -y "@modelcontextprotocol/conformance@${SUITE}" server \
            --url http://127.0.0.1:52444/mcp \
            --requirements "${REVISION}" \
            --expected-failures "tests/conformance/baseline-${REVISION}.yml" \
            --output-dir conformance-results

      # Which scenarios the revision scores is the suite's own frozen
      # requirements file, shipped in its package; the table reads it so that
      # a scenario the suite runs but does not score is not shown as a pass,
      # a regression or a stale entry.
      - name: Read what the suite scores for ${{ matrix.revision }}
        if: always()
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          npm pack --silent "@modelcontextprotocol/conformance@${SUITE}" > suite-tarball.txt
          tar -xzf "$(cat suite-tarball.txt)" "package/requirements/${REVISION}.yaml"
          echo "REQUIREMENTS=--requirements package/requirements/${REVISION}.yaml" >> "${GITHUB_ENV}"

      - name: Pass table
        if: always()
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          if [ -d conformance-results ]; then
            # shellcheck disable=SC2086 # REQUIREMENTS is a flag and its value
            python scripts/conformance_pass_table.py conformance-results \
              "tests/conformance/baseline-${REVISION}.yml" "Server, ${REVISION}" ${REQUIREMENTS} \
              --suite "${SUITE}" --commit "${GITHUB_SHA}" \
              --json "server-${REVISION}.json" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Keep this leg for the published table
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-leg-server-${{ matrix.revision }}
          path: server-${{ matrix.revision }}.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Gateway log on failure
        if: failure()
        run: tail -100 gateway.log

  # The same server suite against the topology the legs above cannot reach
  # (#2307): a front_door gateway, auth on, with the suite's own reference
  # everything-server behind it, so the scenarios that need the reference
  # fixtures are judged through Hangar instead of being "not evaluated here".
  # A front door serves an anonymous caller no tool and `conformance server`
  # cannot present a credential, so tests/conformance/front_door_gateway.py
  # adds one principal's key on a loopback proxy and changes nothing else.
  # The reference server is the conformance repository at the commit the
  # pinned npm version was built from, read from the registry, so the suite
  # and its fixtures cannot drift apart. Its table goes to the job summary
  # only; the published page (`pass-table`) still holds the egress server and
  # client legs alone.
  conformance-front-door:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Server conformance front_door ${{ matrix.revision }} (baselined)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: ["2026-07-28", "2025-11-25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install the gateway
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Fetch the reference server at the suite's commit
        run: |
          commit=$(npm view "@modelcontextprotocol/conformance@${SUITE}" gitHead)
          if [ -z "${commit}" ]; then
            echo "::error::the registry names no commit for conformance@${SUITE}"; exit 1
          fi
          echo "reference server at ${commit}"
          git init -q reference
          git -C reference fetch -q --depth 1 https://github.com/modelcontextprotocol/conformance.git "${commit}"
          git -C reference checkout -q FETCH_HEAD
          npm ci --prefix reference/examples/servers/typescript

      # The front door warms its upstream once, at boot; the harness waits for
      # the reference server before it starts the gateway, and opens the proxy
      # only when the caller's projection holds the reference tools.
      - name: Start the reference server and the front door
        run: |
          (cd reference/examples/servers/typescript && PORT=3000 npx tsx everything-server.ts > ../../../../reference.log 2>&1 &)
          python tests/conformance/front_door_gateway.py \
            --upstream http://127.0.0.1:3000/mcp --port 52445 --log gateway.log > front-door.log 2>&1 &
          for _ in $(seq 1 180); do
            if curl -sf -o /dev/null http://127.0.0.1:52445/health/live; then
              echo "front door ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::the front door never became ready"
          tail -50 front-door.log gateway.log reference.log; exit 1

      - name: Run the conformance suite for ${{ matrix.revision }}
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          npx -y "@modelcontextprotocol/conformance@${SUITE}" server \
            --url http://127.0.0.1:52445/mcp \
            --requirements "${REVISION}" \
            --expected-failures "tests/conformance/baseline-front-door-${REVISION}.yml" \
            --output-dir conformance-results

      # The checkout holds the suite's frozen requirements file for the
      # revision, so the table can mark what the suite runs but does not score.
      - name: Pass table
        if: always()
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          if [ -d conformance-results ]; then
            python scripts/conformance_pass_table.py conformance-results \
              "tests/conformance/baseline-front-door-${REVISION}.yml" "Server, front_door, ${REVISION}" \
              --requirements "reference/requirements/${REVISION}.yaml" \
              --suite "${SUITE}" --commit "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Logs on failure
        if: failure()
        run: tail -100 front-door.log gateway.log reference.log

  # Hangar as the CLIENT under test (#1902). Hangar meets every upstream as an
  # MCP client, so the suite's reference servers judge what it sends them:
  # tests/conformance/hangar_client.py puts the scenario's test server in a
  # config as a remote server and drives the gateway the way a caller would.
  # Both revisions, each against its own baseline; every entry there names the
  # issue that tracks it.
  conformance-client:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Client conformance ${{ matrix.revision }} (baselined)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: "2026-07-28"
            select: "--requirements 2026-07-28"
            scored-by-requirements: true
          - revision: "2025-11-25"
            select: "--spec-version 2025-11-25 --suite all"
            scored-by-requirements: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install the gateway
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run the conformance suite against Hangar as a client
        env:
          SELECT: ${{ matrix.select }}
          REVISION: ${{ matrix.revision }}
        run: |
          # shellcheck disable=SC2086 # SELECT is a list of flags
          npx -y "@modelcontextprotocol/conformance@${SUITE}" client \
            --command "python tests/conformance/hangar_client.py" \
            $SELECT \
            --expected-failures "tests/conformance/baseline-client-${REVISION}.yml" \
            --output-dir conformance-results

      # Which scenarios the revision scores is the suite's own frozen
      # requirements file, shipped in its package; the table reads it so that
      # a scenario the suite runs but does not score is not shown as a pass,
      # a regression or a stale entry.
      - name: Read what the suite scores for ${{ matrix.revision }}
        if: always() && matrix.scored-by-requirements
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          npm pack --silent "@modelcontextprotocol/conformance@${SUITE}" > suite-tarball.txt
          tar -xzf "$(cat suite-tarball.txt)" "package/requirements/${REVISION}.yaml"
          echo "REQUIREMENTS=--requirements package/requirements/${REVISION}.yaml" >> "${GITHUB_ENV}"

      - name: Pass table
        if: always()
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          if [ -d conformance-results ]; then
            # shellcheck disable=SC2086 # REQUIREMENTS is a flag and its value, or empty
            python scripts/conformance_pass_table.py conformance-results \
              "tests/conformance/baseline-client-${REVISION}.yml" "Client, ${REVISION}" ${REQUIREMENTS} \
              --suite "${SUITE}" --commit "${GITHUB_SHA}" \
              --json "client-${REVISION}.json" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Keep this leg for the published table
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-leg-client-${{ matrix.revision }}
          path: client-${{ matrix.revision }}.json
          if-no-files-found: ignore
          retention-days: 7

  # The pass table the docs publish (#1902), assembled from the four
  # revision-selected legs' own output, never typed. It runs whenever the suite
  # was due, so a PR shows the page it would publish; the docs sync takes it
  # only from a run on `main`. A leg that wrote no table fails this job rather
  # than leaving a hole in the page. The 0.1.16 job is not on the page: it
  # judges 2025-11-25 too, and the alpha leg for that revision is the one the
  # other three share a suite version with.
  pass-table:
    name: Conformance pass table
    needs: [changes, conformance-server, conformance-client]
    if: always() && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: conformance-leg-*
          path: legs
          merge-multiple: true

      - name: Assemble the page
        run: |
          legs=""
          for leg in server-2026-07-28 server-2025-11-25 client-2026-07-28 client-2025-11-25; do
            if [ ! -f "legs/${leg}.json" ]; then
              echo "::error::the ${leg} leg wrote no table; refusing to publish a page without it"
              exit 1
            fi
            legs="${legs} legs/${leg}.json"
          done
          # shellcheck disable=SC2086 # legs is a list of paths without spaces
          python3 scripts/conformance_pass_table.py --page ${legs} > conformance-pass-table.md
          cat conformance-pass-table.md >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-pass-table
          path: conformance-pass-table.md
          if-no-files-found: error
          retention-days: 90

  # The one check `main` requires (#1902). It always reports, whatever the
  # trigger and whatever `changes` decided, and it fails closed: if the paths
  # job did not succeed, or the suite was due and any leg did anything but
  # succeed, the check is red. A leg that was not due must have been skipped.
  # The ecosystem watch below is advisory and deliberately not in `needs`.
  conformance-gate:
    name: Conformance
    if: always()
    needs: [changes, conformance, conformance-server, conformance-front-door, conformance-client, pass-table]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every conformance leg passed, or none was due
        env:
          CHANGES: ${{ needs.changes.result }}
          DUE: ${{ needs.changes.outputs.run }}
          LEGS: >-
            ${{ needs.conformance.result }} ${{ needs.conformance-server.result }}
            ${{ needs.conformance-front-door.result }} ${{ needs.conformance-client.result }}
            ${{ needs.pass-table.result }}
        run: |
          echo "paths job: ${CHANGES}; suite due: ${DUE:-false}; legs: ${LEGS}"
          if [ "${CHANGES}" != "success" ]; then
            echo "::error::the paths job did not succeed (${CHANGES}), so nothing says the suite was not due"
            exit 1
          fi
          want=skipped
          [ "${DUE}" = "true" ] && want=success
          for result in ${LEGS}; do
            if [ "${result}" != "${want}" ]; then
              echo "::error::a conformance leg ended ${result}; expected ${want}"
              exit 1
            fi
          done
          if [ "${want}" = "skipped" ]; then
            echo "No change under the conformance paths; the suite did not run."
          fi

  # Gate E is blocked on the ecosystem, not on us: the 2026-07-28 server vectors
  # do not exist yet, and no released MCP client speaks that generation either
  # (the Inspector pins TypeScript SDK v1.x, and npm has no 2.x SDK at all).
  # Both unblock on someone else's release, so this watches for them instead of
  # relying on a person remembering to look.
  #
  # Condition checks, not diffs: each step asks "has the thing we are waiting
  # for happened?" so a quiet week is silent rather than nagging.
  # Advisory throughout -- it must never redden a PR for an upstream release.
  check-for-new-scenarios:
    name: Ecosystem watch (gate E blockers)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      # Compared against BOTH dist-tags. `latest` alone is a blind spot: the
      # 2026-07-28 server vectors and the whole `tasks-*` extension family
      # landed on `alpha` (0.2.0-alpha.x) while `latest` sat unchanged at
      # 0.1.16 -- so a check watching only `latest` reported "no changes" for
      # the exact release gate E was waiting for.
      - name: Compare the pinned scenario list against the published tags
        run: |
          npx -y @modelcontextprotocol/conformance@0.1.16 list > pinned.txt 2>&1 || true
          for tag in latest alpha next beta; do
            npx -y "@modelcontextprotocol/conformance@${tag}" list > "${tag}.txt" 2>&1 || continue
            if ! diff -q pinned.txt "${tag}.txt" >/dev/null; then
              echo "::notice::conformance@${tag} has scenarios the pin does not -- consider bumping."
              diff -u pinned.txt "${tag}.txt" || true
            fi
            if grep -q "2026-07-28" "${tag}.txt"; then
              echo "::notice::conformance@${tag} carries 2026-07-28 server vectors -- gate E's modern half is unblocked."
            fi
            if grep -q "tasks-" "${tag}.txt"; then
              echo "::notice::conformance@${tag} carries tasks-* extension scenarios -- the SEP-2663 relay can be certified against them."
            fi
          done

      # `conformance server` has no `--header` / auth option, and a front door
      # serves an anonymous caller no tool. The front_door leg (#2307) works
      # around it with a loopback proxy that adds one principal's key; an auth
      # option on the suite would let that leg drop the proxy. The `tasks-*`
      # scenarios do run there now, and fail because the reference server has
      # no tasks fixtures (`greet`, `slow_compute`, ...; #2318), not for want
      # of an identity.
      - name: Can the conformance suite authenticate yet?
        run: |
          help=$(npx -y @modelcontextprotocol/conformance@alpha server --help 2>&1 || echo "")
          if [ -z "${help}" ]; then
            echo "::notice::Could not read the conformance CLI help -- this check needs updating."
            exit 0
          fi
          if printf '%s' "${help}" | grep -qiE '\-\-header|\-\-auth|\-\-bearer|\-\-token'; then
            echo "::notice::conformance server now accepts auth/header options -- the front_door leg can drop its key-adding proxy (tests/conformance/front_door_gateway.py)."
          else
            echo "Still no auth option on 'conformance server' -- the front_door leg keeps its proxy."
          fi

      # The interop half of gate E needs a real client that speaks 2026-07-28.
      #
      # This used to ask whether `@modelcontextprotocol/sdk` had published a
      # 2.x. It never will: the TypeScript SDK v2 shipped under NEW package
      # names -- `@modelcontextprotocol/core` / `client` / `server`, all at
      # 2.0.0 -- while `sdk` continues on the v1 line and is still being
      # released. The check therefore answered "still on the v1 line" about a
      # package that had already been superseded: a false all-clear rather than
      # a stale one, silent about the very event it existed to catch.
      #
      # Watching the successor packages instead. Their EXISTENCE at a 2.x is
      # the signal, so there is no version comparison to get wrong.
      - name: Has the TypeScript SDK v2 shipped?
        run: |
          unblocked=0
          for pkg in core client server; do
            version=$(npm view "@modelcontextprotocol/${pkg}" version 2>/dev/null || echo "")
            if [ -z "${version}" ]; then
              echo "@modelcontextprotocol/${pkg}: not published"
              continue
            fi
            echo "@modelcontextprotocol/${pkg} = ${version}"
            major=$(printf '%s' "${version}" | sed -E 's/^[^0-9]*//; s/[.-].*//')
            case "${major}" in
              ''|*[!0-9]*) echo "::notice::Could not read a major from ${version} -- this check needs updating." ;;
              *) [ "${major}" -ge 2 ] && unblocked=1 ;;
            esac
          done
          if [ "${unblocked}" = "1" ]; then
            echo "::notice::The TypeScript SDK v2 packages are published -- a client that speaks 2026-07-28 is now possible; revisit gate E interop."
          else
            echo "No 2.x among the successor packages yet."
          fi

      # The Inspector is the interop candidate, useful to us once it rides an
      # SDK that knows server/discover and the Mcp-Method routing.
      #
      # Retargeted for the same rename: it no longer depends on
      # `@modelcontextprotocol/sdk` at all, so reading that key returned
      # "unknown" forever. That failure was at least loud -- it reported a
      # broken check rather than an all-clear -- but it still could not answer
      # the question.
      - name: Has the Inspector moved to the v2 packages?
        run: |
          manifest=$(curl -sf https://raw.githubusercontent.com/modelcontextprotocol/inspector/main/package.json || echo "")
          if [ -z "${manifest}" ]; then
            echo "::notice::Could not read the Inspector manifest -- this check needs updating."
            exit 0
          fi
          pin=$(printf '%s' "${manifest}" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const p=JSON.parse(d);const deps=p.dependencies||{};console.log(deps["@modelcontextprotocol/client"]||deps["@modelcontextprotocol/core"]||"absent")})')
          if [ "${pin}" = "absent" ]; then
            echo "The Inspector is not on the v2 packages yet."
          else
            echo "::notice::The Inspector now depends on the v2 packages (${pin}) -- it may speak 2026-07-28; revisit gate E interop."
          fi
