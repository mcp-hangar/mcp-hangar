name: CI - Core

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "packages/**"
      - "uv.lock"
      - ".github/workflows/ci-core.yml"
  # No `paths:` filter on pull_request, deliberately. A path-filtered workflow
  # produces no check run at all on a PR it skips -- not a green one, not a
  # skipped one, nothing -- and branch protection reads a check that never
  # reports as pending forever. So `test (3.x)` could not be a required check
  # while this filter stood: the first docs-only PR would have hung on it.
  # Paying a few minutes of wall clock on a README typo is cheaper than a
  # required check that is only sometimes enforced.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default: without this the workflow inherits the repository
# default, which is write on nearly everything. Nothing here writes.
permissions:
  contents: read

env:
  # The newest supported interpreter, spelled once. It must stay equal to the
  # last entry of the `test` matrix below and to the highest
  # `Programming Language :: Python` classifier in pyproject.toml; raising the
  # ceiling means editing all three. `integration-newest` reads it -- expressed
  # as an env var rather than a one-entry matrix so that the check name it
  # reports does not carry the version and does not change when this does.
  NEWEST_PYTHON: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        # ruff comes from the pinned dev dependency, not a version pinned here.
        # Two pins meant CI and developers ran different ruffs, so rules that
        # fired locally were invisible in CI -- two UP042 findings sat unseen
        # for exactly that reason.
        run: pip install -e ".[dev]"

      - name: Ruff check (lint + isort)
        # `tests` is in scope because it is what contributors already lint --
        # AGENTS.md tells them `ruff check src/ tests/`. Leaving CI at `src`
        # meant findings in tests/ were reported by hand, over and over, with
        # no gate to land the fix against. Import order IS checked: `I` is in
        # ruff's `select`, and the pre-commit hook runs the same ruff (#1496).
        run: ruff check src/mcp_hangar tests

      - name: Ruff format check
        run: ruff format --check src/mcp_hangar tests

      - name: Type check
        run: mypy src/mcp_hangar

      - name: Import contracts
        # Layering is checked here rather than by a grep in review. Note the
        # companion test: `lint-imports` exits 0 on an empty contract file, so
        # tests/unit/test_import_contracts.py guards the contract itself.
        run: lint-imports --config .importlinter

      - name: Dead symbols
        # Which public symbols does nothing reference? Five defects this month
        # were code that could not run -- an adapter never constructed, a port
        # never injected, a module with no callers -- and each was found by
        # accident. The baseline in pyproject.toml can only shrink; its
        # companion test guards the baseline itself.
        run: python scripts/check_dead_symbols.py

      - name: Tracing without the SDK is a no-op
        # The test jobs install the `opentelemetry` extra; this job does not, so
        # it is the one run of the API-only install (`mcp` pulls in the OTel API,
        # not the SDK). Tracing there must degrade to a no-op, never raise. The
        # first assert keeps this honest: if a dev dependency ever pulls the SDK
        # in, the step would prove nothing, so it fails instead.
        run: |
          python - <<'EOF'
          import importlib.util
          assert importlib.util.find_spec("opentelemetry.sdk") is None, "lint must stay API-only"
          from mcp_hangar.observability import tracing as t
          assert not t.OTEL_AVAILABLE and not t.is_tracing_enabled() and t.init_tracing() is False
          assert isinstance(t.get_tracer(), t.NoOpTracer)
          with t.upstream_call_span("tools/call", {"name": "x"}) as span:
              assert isinstance(span, t.NoOpSpan)
              t.mark_span_error(span, "boom")
          carrier = {}
          t.inject_trace_context(carrier)
          assert carrier == {} and t.extract_trace_context({"traceparent": "x"}) is None
          assert t.get_current_trace_id() is None and t.get_current_span_id() is None
          EOF

  # PARALLEL TEST RUNS. Every pytest step below that runs the suite passes
  # `-n auto --dist loadfile` (pytest-xdist, a dev dependency): one worker per
  # vCPU, a whole FILE per worker. `loadfile`, not the default `load`, because
  # the suite's slowest cost is module-scoped: the real-clock subprocess
  # harnesses at default settings (e.g. the readiness retry-window test, ~70 s)
  # set up once per module, and `load` would split a module's tests across
  # workers and pay that setup on each. Module fixtures and the process-global
  # state a file sets up stay in one worker. Serial, `decision-coverage` alone
  # was ~14 minutes and the critical path of the workflow.
  #
  # Order changes under xdist: a worker runs an arbitrary subset of files in its
  # own process. A test that passes serially and fails here is leaning on state
  # an earlier file left behind; fix the leak where it starts, do not pin the
  # victim to a worker.
  #
  # COVERAGE comes from these runs, not from a run of its own. `test (3.11)`
  # measures tests/unit and `integration` measures tests/integration, each with
  # the marker expression the floors were measured on; `decision-coverage`
  # below combines the two data files into one report. See the note there.
  test:
    # Spelled out because the matrix carries more than the version: without an
    # explicit name the extra `include` keys would join the reported context
    # (`test (3.11, true)`), and `test (3.x)` are required checks by name.
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # FLOOR AND CEILING ON PULL REQUESTS, ALL FOUR ON MAIN. A version marked
        # `main_only` reports its check on a pull request but runs nothing; on a
        # push to main it runs in full. The list lives here and nowhere else --
        # the conditions below read the flag, never a version number.
        #
        # Why the middle versions: version-specific breakage is a floor/ceiling
        # surface (see the #1518 note under `Run tests`). A dependency floor or
        # a removed API breaks the oldest interpreter; a reworded message or a
        # new deprecation breaks the newest. A middle version repeats what one
        # of the two ends already found, so on a pull request it buys minutes,
        # not signal. It is not dropped: every push to main runs 3.12 and 3.13,
        # so a middle-only break shows up on main within one merge, and
        # release.yml runs the whole tree on all four before a tag.
        #
        # The skip is per STEP, not per job, because `test (3.12)` and
        # `test (3.13)` are required checks and must report on every PR. A
        # job-level `if:` cannot read `matrix` (it is evaluated before the matrix
        # expands), and a matrix entry left out would leave its check pending
        # forever. The entry therefore runs, skips its steps and reports green.
        # A green `test (3.12)` on a PR is not a test run and must not pass for
        # one, so the job says so in its summary and in an annotation.
        include:
          - python-version: "3.11"
            coverage: true
          - python-version: "3.12"
            main_only: true
          - python-version: "3.13"
            main_only: true

    env:
      RUN_SUITE: ${{ github.event_name != 'pull_request' || !matrix.main_only }}

    steps:
      - name: Say that this version runs on main only
        if: env.RUN_SUITE != 'true'
        env:
          PY: ${{ matrix.python-version }}
        run: |
          msg="Python ${PY}: tests skipped on pull requests; runs on main. Pull requests test the floor (3.11) and the ceiling (${NEWEST_PYTHON})."
          echo "::notice title=test (${PY}) did not run::${msg}"
          {
            echo "### test (${PY}): skipped on pull requests; runs on main"
            echo ""
            echo "${msg} This check is green without running a test."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.RUN_SUITE == 'true'

      - name: Set up Python ${{ matrix.python-version }}
        if: env.RUN_SUITE == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        if: env.RUN_SUITE == 'true'
        # `.[dev]` carries only the OTel API (via `mcp`); the tracing contract
        # tests need the SDK from the `opentelemetry` extra. Under CI they fail
        # without it (tests/conftest.py) rather than skip, so dropping the extra
        # here turns the job red. `lint` stays API-only and smoke-tests that.
        run: pip install -e ".[dev,opentelemetry]"

      - name: Run tests
        if: env.RUN_SUITE == 'true'
        # tests/unit with the coverage selection's marker expression. On 3.11
        # this step also measures coverage (COV_ARGS); the other versions run
        # the same selection without it. The rest of the tree runs in the next
        # step, so nothing outside the selection leaks into the report.
        #
        # Integration is excluded because it has its own jobs below. Run here,
        # this matrix would execute `tests/integration` four times over, on top
        # of the two integration jobs. The suite launches no containers, so the
        # cost is runner minutes and nothing else.
        #
        # This note used to carry a second reason: that the suite "touches no
        # version-specific surface the unit tests do not". That was false, and
        # #1518 is the bill. An integration assertion pinned the CPython wording
        # for `0 ** -1`, 3.14 reworded it, and because integration ran on 3.11
        # alone in the merge path the first run that looked was the v2.21.0
        # release -- after the tag was cut. The surface is real, but it is a
        # CEILING surface: a newer interpreter finds it, a middle one repeats
        # the finding. So it is covered by one more job, `integration-newest`
        # below, and not by folding the suite back into this matrix.
        #
        # `not live`: tests/unit holds no live-marked test today, and a live
        # test is skipped here anyway (tests/live/conftest.py skips every live
        # item unless MCP_HANGAR_LIVE_VERIFY=1). The expression is here so the
        # measured selection is the pinned one by construction.
        #
        # `not benchmark`: the benchmarks run serially, further down.
        #
        # $COV_ARGS is unquoted on purpose: two words on 3.11, none elsewhere.
        env:
          COV_ARGS: ${{ matrix.coverage && '--cov=mcp_hangar --cov-report=' || '' }}
        run: pytest tests/unit -n auto --dist loadfile -m "not benchmark and not live" $COV_ARGS

      - name: Keep the unit coverage data
        if: env.RUN_SUITE == 'true' && matrix.coverage
        # The raw data file, not a report: `decision-coverage` combines it with
        # the integration half. The coverage version travels with it, because
        # the report must be written by the same coverage that measured.
        run: |
          mkdir -p coverage-data
          mv .coverage coverage-data/.coverage.unit
          python -c "import coverage; print(coverage.__version__)" > coverage-data/coverage-version.unit

      - name: Upload the unit coverage data
        if: env.RUN_SUITE == 'true' && matrix.coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-unit
          path: coverage-data/
          # `.coverage.unit` is a dot-file; upload-artifact skips those unless told.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Run the tests outside the coverage selection
        if: env.RUN_SUITE == 'true'
        # Everything `test` ran before coverage moved here that is not
        # tests/unit: tests/ci and tests/live (skipped without opt-in, see
        # above), and any new directory by default -- `--ignore`, not a list.
        # No coverage: these are not part of the selection the floors measure.
        run: pytest --ignore=tests/integration --ignore=tests/unit -n auto --dist loadfile -m "not benchmark"

      - name: Run benchmarks
        if: env.RUN_SUITE == 'true'
        # Serial, and on purpose. pytest-benchmark switches itself off under
        # xdist ("Benchmarks are automatically disabled because xdist plugin is
        # active") and calls each benchmarked function ONCE. The tests still
        # pass, so the loss is silent -- and `test_full_path_p99_assertion`
        # collects its own timings and checks p99 < 5 ms only with at least ten
        # samples, so under xdist that assertion would never run. `-p no:xdist`
        # takes the plugin out of this step entirely, so the benchmarks time
        # thousands of rounds each, as they did before. ~15 s.
        run: pytest --ignore=tests/integration -m benchmark -p no:xdist

  decision-coverage:
    # ONE REPORT, ONE SELECTION, MEASURED ONCE -- from the data the test jobs
    # already produce. `test (3.11)` measures tests/unit and `integration`
    # measures tests/integration, both on 3.11 and both with
    # `-m "not benchmark and not live"`; this job combines the two data files
    # and gates on the result. The union is exactly the selection the floors in
    # [tool.decision_coverage.floors] were measured against
    # (`tests/unit tests/integration -m "not benchmark and not live"`), which
    # this job used to re-run in full for the sake of the number: ~6 minutes
    # of runner time repeating two suites that had just passed next door.
    #
    # Still a SEPARATE job, and still measured once:
    #  * the other matrix entries do not measure, so there is one number, not
    #    four that nobody can reconcile; codecov gets one upload under `core`.
    #  * a dedicated job name is the required check; the gate does not hide
    #    inside `test (3.11)`, and a coverage failure is not a test failure.
    #  * `!cancelled()`: a red `test (3.14)` does not stop the gate from
    #    reporting on the 3.11 data. If a half is missing (its tests failed, so
    #    it uploaded nothing), the combine step below fails -- a partial report
    #    never passes for a whole one.
    #
    # Combining across runners works because [tool.coverage.run] sets
    # `relative_files = true`: both halves record `src/mcp_hangar/...`, not an
    # absolute runner path. Branch mode also comes from there, so both halves
    # and the report agree -- and the gate refuses a statement-only report.
    needs: [test, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        # 3.11, the interpreter that measured. Branch arcs are computed from
        # the source at report time and differ between CPython versions (see
        # the floors' note in pyproject.toml).
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Download the coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Install coverage
        # The version that measured, read from the data, not a second pin here.
        # Both halves were installed from the same `.[dev]` in the same run, so
        # they agree; if they ever do not, stop rather than report on a mix.
        run: |
          for half in unit integration; do
            if [ ! -f "coverage-data/.coverage.${half}" ]; then
              echo "::error::No ${half} coverage data: that half's tests failed or did not run, so there is nothing whole to report on."
              exit 1
            fi
          done
          unit_version=$(cat coverage-data/coverage-version.unit)
          integration_version=$(cat coverage-data/coverage-version.integration)
          if [ "$unit_version" != "$integration_version" ]; then
            echo "::error::The halves were measured by different coverage versions (${unit_version} vs ${integration_version})."
            exit 1
          fi
          pip install "coverage==${unit_version}"

      - name: Combine branch coverage
        run: |
          coverage combine coverage-data
          coverage json -o coverage.json
          coverage xml -o coverage.xml
          total=$(coverage report --format=total --precision=2)
          echo "Combined line+branch coverage, unit + integration: ${total}%" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enforce decision-path floors
        run: python scripts/check_decision_coverage.py coverage.json

      - name: Upload coverage
        # The only coverage upload in the workflow, from the only report.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          flags: core
          fail_ci_if_error: false

      - name: Upload the coverage report on failure
        # Without this a floor breach is only ever a number in a log line, and
        # diagnosing it means guessing which branches moved. The report names
        # the missing arcs per module.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: decision-coverage-report
          path: coverage.json
          retention-days: 7

  # The integration signal is split across the two jobs below: `integration`
  # pins the supported FLOOR (3.11) and `integration-newest` pins the CEILING
  # (3.14). Between them a version-specific integration failure is caught by a
  # PR instead of by a release.
  #
  # Neither waits for `test`. The suite is in-process -- no container, nothing
  # `test` builds or publishes -- so `needs: [test]` bought no signal, only
  # serialisation: integration could not start until the slowest unit matrix
  # entry had finished, which put the two back to back on the critical path.
  #
  # Counterpart: release.yml's `test` job runs `python -m pytest tests/` -- the
  # whole tree, integration included -- across the same four versions. That is
  # deliberately broader than anything here, and the invariant is that nothing
  # it runs is unreachable from a PR. See the note there.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        # With the SDK, as in `test` -- see the note there.
        run: pip install -e ".[dev,opentelemetry]"

      - name: Run integration tests
        # The integration half of the coverage selection, so it measures (see
        # `decision-coverage`). The marker expression selects nothing away from
        # tests/integration today; it is here so the measured selection is the
        # pinned one by construction. `integration-newest` runs the same
        # command without `--cov`.
        run: |
          pytest tests/integration/ -v --tb=short --timeout=60 -n auto --dist loadfile \
            -m "not benchmark and not live" --cov=mcp_hangar --cov-report=

      - name: Keep the integration coverage data
        run: |
          mkdir -p coverage-data
          mv .coverage coverage-data/.coverage.integration
          python -c "import coverage; print(coverage.__version__)" > coverage-data/coverage-version.integration

      - name: Upload the integration coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-integration
          path: coverage-data/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  integration-newest:
    # The same selection as `integration` above, on the newest supported
    # interpreter instead of the floor. Keep the two commands identical except
    # for `--cov` (the floor measures; this job does not): the point of this
    # job is that the only variable is the Python version.
    #
    # A SEPARATE JOB, not a `strategy.matrix` on `integration`, and that is not
    # a style choice. `integration` is a required status check on `main`. Adding
    # a matrix to it renames the reported context to `integration (3.11)`, so
    # the required context `integration` would never report again and every open
    # PR would wedge as pending. A plain second job also keeps this context name
    # stable across a ceiling bump: raising `python-version` below to 3.15 leaves
    # the check named `integration-newest`, where a matrix would rename it to
    # `integration-newest (3.15)` and break branch protection a second time.
    #
    # NOTE: a new job does not gate merges until it is added to the required
    # checks on `main`. The exact context name to add is `integration-newest`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ env.NEWEST_PYTHON }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.NEWEST_PYTHON }}

      - name: Install dependencies
        # With the SDK, as in `test` -- see the note there.
        run: pip install -e ".[dev,opentelemetry]"

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short --timeout=60 -n auto --dist loadfile \
            -m "not benchmark and not live"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install hatch
        run: pip install hatch

      - name: Build package
        run: hatch build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-dist
          path: dist/
