apiVersion: v1
kind: ConfigMap
metadata:
  name: hangar-config
  namespace: ha-test
data:
  config.yaml: |
    persistence:
      backend: postgresql
      postgresql:
        host: postgres
        port: 5432
        user: hangar
        password: hangar
        database: hangar
    coordination:
      lease_ttl_s: 10
      renew_interval_s: 3
      renew_deadline_s: 6
    discovery:
      enabled: false
    mcp_servers: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hangar
  namespace: ha-test
spec:
  selector: {app: hangar}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hangar
  namespace: ha-test
spec:
  replicas: 2
  selector: {matchLabels: {app: hangar}}
  template:
    metadata: {labels: {app: hangar}}
    spec:
      containers:
        - name: hangar
          image: localhost/mcp-hangar:acceptance
          imagePullPolicy: Never
          args: ["serve", "--http", "--host", "0.0.0.0", "--port", "8080", "--unsafe-no-auth"]
          env:
            - {name: MCP_CONFIG, value: /etc/hangar/config.yaml}
            - name: HANGAR_INSTANCE_LABEL
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: config, mountPath: /etc/hangar}]
      volumes: [{name: config, configMap: {name: hangar-config}}]
