# Known non-passes of the official MCP conformance suite against `serve --http`,
# run with `--requirements 2026-07-28` (the scenarios that revision requires).
#
# Same semantics as baseline.yml: a failure listed here is known, a failure not
# listed is a regression, and a listed scenario that now passes is a stale entry
# that fails the run until its line is deleted. A WARNING counts as a non-pass
# here, as it does in the suite; a SKIPPED check counts neither way.
#
# The gateway under test is the one conformance.yml starts: one subprocess
# backend (`examples/provider_math`), no authentication, `mode` left at its
# default. Every entry below is classified; the classification says why the
# scenario cannot pass in THAT setup, which is not the same as saying the
# gateway is wrong. Read a line as "not evaluated here", not "broken".
#
# ---------------------------------------------------------------------------
# 1. Fixture-dependent. The scenario calls a tool, prompt or resource that the
#    suite's reference server defines (`json_schema_2020_12_tool`,
#    `test_missing_capability`, `failing_job`, `confirm_delete`, image/audio
#    tools, an `x-mcp-header` annotated tool, ...). The gateway relays what its
#    upstream serves and the math backend serves none of these. The
#    front_door leg (#2307, baseline-front-door-2026-07-28.yml) runs the same
#    suite with the reference server behind the gateway; each line below says
#    what that leg found: a pass, or the issue that tracks the non-pass.
#
# 2. Capability not advertised. Hangar declares no `completions`, `prompts` or
#    `resources` for this configuration, so `completion/complete`, `prompts/*`
#    and `resources/*` answer -32601. The suite runs these scenarios regardless
#    of what discovery advertised. `caching` is in this group because three of
#    its seven checks are the prompts/resources list hints; the tools/list check
#    passes.
#
# 3. Gateway behaviour with no fixture to exercise it. The `input-required-*`
#    and `tasks-*` families need a backend tool that returns an
#    InputRequiredResult or creates a task. With no such upstream in the run,
#    the gateway returns an ordinary complete result, which the suite reports
#    as a failure. The front_door leg, with the reference server behind it,
#    showed that the front door does not relay an InputRequiredResult either
#    (#2313), and that the reference server has no tasks fixtures (#2318).
#
# Hangar as the CLIENT under test is judged in baseline-client-2026-07-28.yml.
# ---------------------------------------------------------------------------

server:
  # -- 1. fixture-dependent ---------------------------------------------------
  - server-stateless # needs test_missing_capability; on front_door: #2315, #2318
  - json-schema-2020-12 # needs json_schema_2020_12_tool; passes on front_door (#2307)
  - http-custom-header-server-validation # needs a tool with x-mcp-header; the reference server has none (#2318)
  - tools-call-image # passes on front_door (#2307)
  - tools-call-audio # passes on front_door (#2307)
  - tools-call-embedded-resource # passes on front_door (#2307)
  - tools-call-mixed-content # passes on front_door (#2307)
  - tools-call-with-progress # on front_door: progress is dropped (#2314)

  # -- 2. capability not advertised -------------------------------------------
  - completion-complete # passes on front_door (#2307)
  - prompts-list # passes on front_door (#2307)
  - prompts-get-simple # passes on front_door (#2307)
  - prompts-get-with-args # passes on front_door (#2307)
  - prompts-get-embedded-resource # passes on front_door (#2307)
  - prompts-get-with-image # passes on front_door (#2307)
  - resources-list # passes on front_door (#2307)
  - resources-read-text # on front_door: URIs are namespaced (#1025)
  - resources-read-binary # on front_door: URIs are namespaced (#1025)
  - resources-templates-read # on front_door: URIs are namespaced (#1025)
  - sep-2164-resource-not-found # resources/read answers -32601, the check wants -32602; on front_door: #2316
  - caching # prompts/resources hints; the tools/list hint passes; passes on front_door (#2307)

  # -- 3. no fixture to exercise the relay ------------------------------------
  - input-required-result-basic-elicitation # not relayed on front_door either (#2313)
  - input-required-result-basic-sampling # not relayed on front_door either (#2313)
  - input-required-result-basic-list-roots # not relayed on front_door either (#2313)
  - input-required-result-request-state # not relayed on front_door either (#2313)
  - input-required-result-multiple-input-requests # not relayed on front_door either (#2313)
  - input-required-result-multi-round # not relayed on front_door either (#2313)
  - input-required-result-missing-input-response # not relayed on front_door either (#2313)
  - input-required-result-non-tool-request # not relayed on front_door either (#2313)
  - input-required-result-result-type # not relayed on front_door either (#2313)
  - input-required-result-tampered-state # not relayed on front_door either (#2313)
  - input-required-result-capability-check # not relayed on front_door either (#2313)
  - input-required-result-validate-input # not relayed on front_door either (#2313)
  - tasks-lifecycle # the reference server has no tasks fixtures (#2318)
  - tasks-capability-negotiation # the reference server has no tasks fixtures (#2318)
  - tasks-wire-fields # the reference server has no tasks fixtures (#2318)
  - tasks-request-state-removal # the reference server has no tasks fixtures (#2318)
  - tasks-mrtr-input # the reference server has no tasks fixtures (#2318)
  - tasks-request-headers # the reference server has no tasks fixtures (#2318)
  - tasks-dispatch-and-envelope # the reference server has no tasks fixtures (#2318)
  - tasks-status-notifications # runs no check on front_door; the reference server has no tasks fixtures (#2318)
  - tasks-required-task-error # the reference server has no tasks fixtures (#2318)
  - tasks-mrtr-composition # the reference server has no tasks fixtures (#2318)
