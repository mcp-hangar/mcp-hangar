services:
  # Main MCP Hangar server
  mcp-hangar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-hangar
    ports:
      # Loopback only. The gateway runs with --unsafe-no-auth below, so a bare
      # "8080:8080" -- which Docker binds on every host interface -- would hand
      # the management API to anyone who can reach this host (#2040). Configure
      # authentication before publishing it anywhere else.
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_LOG_LEVEL=INFO
      - MCP_CONFIG=/app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    command: ["serve", "--http", "--host", "0.0.0.0", "--port", "8080", "--unsafe-no-auth"]
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      # A real readiness probe; the previous one could never fail. `python3`
      # because the image ships neither curl nor wget.
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://localhost:8080/health/ready", timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Example math provider (optional)
  math-provider:
    build:
      context: ./examples/provider_math
      dockerfile: Dockerfile
    container_name: mcp-math-provider
    restart: unless-stopped
    networks:
      - mcp-network
    profiles:
      - with-providers

networks:
  mcp-network:
    driver: bridge

volumes:
  logs:
    driver: local
