# Pre-commit hooks for code quality
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files
#
# Ruff handles linting, import sorting (isort) and formatting (black). `I` is
# in `select` in pyproject.toml, so import order is checked by the hook and by
# CI alike, against the same ruff. Turning it on was a one-time reformat of 527
# files; that commit is listed in `.git-blame-ignore-revs` (#1496).
#
# The `rev` below must equal the `ruff==` pin in the dev extra of
# pyproject.toml, which is the ruff CI installs. Two pins are two formatters;
# tests/unit/test_pre_commit_ruff_matches_the_dev_pin.py fails when they drift.

repos:
  # Ruff - Fast Python linter + formatter (replaces black and flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        name: ruff check (lint + isort)
        args: ["--fix"]
        files: ^(src|tests)/
      - id: ruff-format
        name: ruff format
        files: ^(src|tests)/

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: ["--fix", "--config", ".markdownlint.json"]
        files: \.(md|markdown)$
        exclude: ^\.planning/

  # Built-in pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"] # Allow custom YAML tags
        exclude: '^(deploy/helm|packages/helm-charts)/.*/templates/.*\.yaml$' # Exclude Helm templates
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  # Changelog fragments. Cheap here, and the alternative is finding a malformed
  # fragment during release assembly -- on the release branch, with the release
  # waiting on it.
  - repo: local
    hooks:
      - id: changelog-fragments
        name: validate changelog fragments
        entry: python scripts/build_changelog.py check
        language: system
        pass_filenames: false
        files: ^changelog\.d/

  # Pytest check (optional - runs fast tests)
  # Uncomment if you want tests to run on commit
  # - repo: local
  #   hooks:
  #     - id: pytest-check
  #       name: pytest-check
  #       entry: pytest
  #       language: system
  #       pass_filenames: false
  #       always_run: true
  #       args: ['-m', 'not slow', '--tb=short']

  # Tool digest drift (`mcp-hangar pin --check`), the hook README.md sends you
  # here to copy. Commented, because it is not this repository's check to run:
  # it guards a fleet's configuration, and this repository configures no fleet.
  #
  # `--check` starts every server the config names, reads what each one serves
  # right now, and exits 1 when a tool's schema no longer matches the digest
  # written beside it -- a rewritten tool *description* being the change that
  # alters no parameter and still redirects the model. Before it can say
  # anything, two things have to be true on the machine running it:
  #
  #   1. A config file exists -- `--config <path>`, else $MCP_CONFIG, else
  #      ./config.yaml. There is none in this tree: `/config.yaml` is
  #      gitignored, and `examples/rugpull/` carries none with pins on purpose.
  #      Without one the hook exits 2 on every commit.
  #   2. `mcp-hangar pin --config <path> --write` has recorded the digests.
  #      Pins are a subset by design, so a config with none exits 0 having
  #      checked nothing -- a green hook that is not covering you.
  #
  # The cost is real: every configured upstream is launched and handshaken on
  # each commit, and one that cannot start is exit 2, never a quiet 0. That is
  # the right answer for CI, and it is why enabling this belongs to whoever
  # knows their own upstreams. `--quiet` keeps the success chatter out and
  # still prints drift (#1236).
  #
  # - repo: local
  #   hooks:
  #     - id: mcp-hangar-pin-check
  #       name: mcp-hangar pin --check (tool digest drift)
  #       entry: mcp-hangar pin --check --quiet --config config.yaml
  #       language: system
  #       pass_filenames: false
  #       # Drift arrives from the upstream, not from an edit to the file, so
  #       # there is no path that predicts it. Narrow this to
  #       # `files: ^config\.yaml$` and the hook only catches your own edits.
  #       always_run: true
